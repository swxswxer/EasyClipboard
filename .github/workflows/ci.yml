name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri

  windows:
    name: Windows x64 checks and NSIS
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test --target x86_64-pc-windows-msvc
        working-directory: src-tauri
      - run: cargo clippy --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: src-tauri
      - run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: EasyClipboard-windows-x64-setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
