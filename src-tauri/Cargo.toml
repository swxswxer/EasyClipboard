[package]
name = "easyclipboard"
version = "0.1.1"
description = "Local-first Windows and macOS clipboard history"
authors = ["EasyClipboard"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "easyclipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rusqlite = { version = "0.6", features = ["bundled"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
macos-accessibility-client = "0.0.1"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSURL"] }
plist = "1.7"
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[test]]
name = "pasteboard_integration"
path = "tests/pasteboard_integration.rs"
harness = false
